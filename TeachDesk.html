<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeachDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--ink:#14302b;--mut:#5b7069;--card:#fff;--acc:#0f6b5c;--onacc:#fff;--hi:#f2b705;--bad:#b83f0c;--ok:#16794a;--line:#d5e0dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b18;--ink:#e6f0ed;--mut:#98b0a9;--card:#162622;--acc:#3fc2a8;--onacc:#06201a;--hi:#f2c230;--bad:#ff9362;--ok:#5fd596;--line:#274039;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b18;--ink:#e6f0ed;--mut:#98b0a9;--card:#162622;--acc:#3fc2a8;--onacc:#06201a;--hi:#f2c230;--bad:#ff9362;--ok:#5fd596;--line:#274039;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Atkinson Hyperlegible',system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--acc);color:var(--onacc);padding:12px 16px;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:19px}header span{font-size:13px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:14px}
h2{margin:6px 0 10px;font-size:20px}h3{margin:14px 0 6px;font-size:16px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--hi);border-radius:6px;padding:10px}
.stat b{display:block;font-size:24px}.stat small{color:var(--mut)}
button,.b{font:inherit;border:0;border-radius:8px;padding:10px 14px;min-height:44px;background:var(--acc);color:var(--onacc);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.g{background:transparent;color:var(--acc);border:1px solid var(--line)}.sm{min-height:36px;padding:6px 10px;font-size:14px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.mut{color:var(--mut);font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:44px}
label{display:block;margin:8px 0;font-size:14px;color:var(--mut)}label input,label select,label textarea{margin-top:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{background:none;color:var(--mut);flex:0 0 auto;min-width:68px;flex-direction:column;font-size:12px;padding:6px;min-height:50px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--hi)}
.seg button{background:var(--card);color:var(--ink);border:1px solid var(--line);min-width:44px}
.seg button.P{background:var(--ok);color:#fff}.seg button.A{background:var(--bad);color:#fff}.seg button.L{background:var(--hi);color:#222}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal div{padding:8px 0;border-radius:6px;background:var(--card);border:1px solid var(--line);cursor:pointer;min-height:44px}
.cal .h{background:none;border:0;color:var(--mut);font-size:12px;cursor:default;min-height:0}.cal .t{border-color:var(--acc)}.cal .s{background:var(--acc);color:var(--onacc)}
.cal i{display:block;width:6px;height:6px;border-radius:9px;background:var(--hi);margin:2px auto 0}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;overflow:auto;padding:16px}#sheet.on{display:block}
.box{background:var(--bg);max-width:560px;margin:0 auto;border-radius:12px;padding:16px}
.wide{overflow-x:auto}
@media print{body>*:not(#sheet){display:none!important}#sheet{position:static;background:none;padding:0}.box{max-width:none;background:#fff;color:#000}.row button,.noprint{display:none!important}}

:root{--bg:#f3f4fb;--ink:#191b3a;--mut:#62668a;--card:#fff;--acc:#3b3a8f;--onacc:#fff;--hi:#c79a2e;--bad:#c2410c;--ok:#12805c;--onok:#fff;--onbad:#fff;--line:#dfe1f2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e22;--ink:#e8e9ff;--mut:#9a9dc9;--card:#171936;--acc:#a5a3ff;--onacc:#12123a;--hi:#e6c36a;--bad:#ff9a6a;--ok:#5fd7a5;--onok:#06241a;--onbad:#2b1005;--line:#2a2d57}}
:root[data-theme="dark"]{--bg:#0d0e22;--ink:#e8e9ff;--mut:#9a9dc9;--card:#171936;--acc:#a5a3ff;--onacc:#12123a;--hi:#e6c36a;--bad:#ff9a6a;--ok:#5fd7a5;--onok:#06241a;--onbad:#2b1005;--line:#2a2d57}
header{background:linear-gradient(120deg,#1f1e55,#4a3fa0 70%,#6b4fb8);color:#fff}
.card{box-shadow:0 4px 16px rgba(40,40,120,.07)}.stat{box-shadow:0 4px 14px rgba(40,40,120,.08)}
.seg button.P{background:var(--ok);color:var(--onok)}.seg button.A{background:var(--bad);color:var(--onbad)}.seg button.L{background:var(--hi);color:#2a2105}
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 10px}
.rgs{display:flex;gap:6px;justify-content:space-around}.rg{text-align:center}.rg small{display:block;color:var(--mut)}
.arc{transition:stroke-dashoffset .9s ease}@media(prefers-reduced-motion:reduce){.arc,.bar i{transition:none}}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--hi));transition:width .4s}
.tap{cursor:pointer}.tap:active{transform:scale(.99)}
.st1{background:var(--hi);color:#2a2105;border-color:var(--hi)}.st2{background:var(--ok);color:var(--onok);border-color:var(--ok)}
.chip{min-height:36px;padding:4px 12px;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px}
.chip.S{background:var(--ok);color:var(--onok)}.chip.L{background:var(--hi);color:#2a2105}.chip.X{background:var(--bad);color:var(--onbad)}
.opt{width:100%;margin:5px 0;background:var(--card);color:var(--ink);border:2px solid var(--line);justify-content:flex-start;text-align:left}
.opt:disabled{opacity:1;cursor:default}.opt.right{border-color:var(--ok);background:var(--ok);color:var(--onok)}.opt.wrong{border-color:var(--bad);background:var(--bad);color:var(--onbad)}
.lb{display:flex;align-items:center;gap:10px;padding:6px 0}.lb .n{width:28px;height:28px;border-radius:50%;background:var(--hi);color:#2a2105;display:grid;place-items:center;font-weight:700}
</style></head><body>
<header><b id="ttl">TeachDesk</b><span id="dt"></span></header>
<main id="main"></main><nav id="nav"></nav><div id="sheet"></div>
<script>
const K='teachdesk_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>ymd(new Date()),inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dow=d=>DAYS[new Date(d+'T00:00').getDay()];
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
function demo(){const m=today().slice(0,7),b1=uid(),b2=uid(),s=[['Aarav Sharma',b1,'Rakesh Sharma','9810000001'],['Diya Verma',b1,'Meena Verma','9810000002'],['Kabir Singh',b1,'Harpreet Singh','9810000003'],['Ananya Gupta',b2,'Sunil Gupta','9810000004'],['Rohan Mehta',b2,'Pooja Mehta','9810000005']].map((x,i)=>({id:uid(),name:x[0],batch:x[1],roll:i+1,parent:x[2],phone:x[3],address:'Delhi',joined:'2026-04-01',notes:'',active:'Yes'}));
const ex=uid();return{demo:true,set:{name:'My Tuition Classes',dueDay:10},
batches:[{id:b1,name:'Class 9 Maths',subject:'Maths',days:'Mon,Wed,Fri',time:'16:00',fee:1500},{id:b2,name:'Class 10 Science',subject:'Science',days:'Tue,Thu,Sat',time:'17:00',fee:1800}],
students:s,att:{},fees:[{id:uid(),sid:s[0].id,month:m,amt:1500,disc:0,mode:'UPI',date:today(),rcpt:1001}],
exams:[{id:ex,batch:b1,name:'Unit Test 1',date:'2026-10-15',max:50,marks:{[s[0].id]:44,[s[1].id]:47,[s[2].id]:31}}],
ptm:[{id:uid(),sid:s[2].id,date:'2026-10-20',who:'Mother',notes:'Needs more practice in algebra.',action:'Weekly practice sheet',follow:ymd(new Date(Date.now()+3*864e5))}],events:[]}}
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}if(!db)db=demo();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
db.chap=db.chap||[];db.hw=db.hw||[];db.quiz=db.quiz||[];
if(db.demo&&!db.chap.length&&db.batches.length){const b1=db.batches[0].id,b2=(db.batches[1]||db.batches[0]).id;
db.chap=[['Real numbers',2],['Polynomials',2],['Linear equations',1],['Quadratics',0]].map(x=>({id:uid(),batch:b1,title:x[0],st:x[1],date:''})).concat([['Chemical reactions',2],['Acids and bases',1],['Metals',0]].map(x=>({id:uid(),batch:b2,title:x[0],st:x[1],date:''})));
const s1=db.students.filter(s=>s.batch==b1);
db.hw=[{id:uid(),batch:b1,title:'Exercise 2.1, Q1 to 10',due:ymd(new Date(Date.now()+2*864e5)),max:10,sub:s1.length>1?{[s1[0].id]:'S',[s1[1].id]:'L'}:{}}];
db.quiz=[{id:uid(),batch:b1,q:'What is the degree of x² + 3x + 2?',o:['1','2','3','0'],c:1},{id:uid(),batch:b1,q:'Which of these is a prime number?',o:['21','27','29','33'],c:2},{id:uid(),batch:b1,q:'What is 7 × 8?',o:['54','56','58','64'],c:1}];
for(let i=0;i<7;i++){const d=ymd(new Date(Date.now()-i*864e5));db.batches.forEach(b=>{const k=d+'|'+b.id;db.att[k]={};db.students.filter(x=>x.batch==b.id).forEach((x,j)=>db.att[k][x.id]=(i+j)%6==0?'A':'P')})}}
const S=id=>db.students.find(x=>x.id==id),B=id=>db.batches.find(x=>x.id==id);
const st={v:'dash',q:'',bat:db.batches[0]?.id||'',date:today(),month:today().slice(0,7),exam:'',cm:today().slice(0,7),cd:today(),rep:db.students[0]?.id||''};
const grade=p=>p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=40?'D':'F';
const active=()=>db.students.filter(s=>s.active!='No');
const inB=b=>active().filter(s=>s.batch==b);
const attKey=(d,b)=>d+'|'+b;
function pct(sid,month){let t=0,p=0;for(const k in db.att){const[d]=k.split('|');if(month&&!d.startsWith(month))continue;const v=db.att[k][sid];if(v){t++;if(v!='A')p++}}return t?Math.round(p/t*100):null}
function due(sid,month){const s=S(sid),b=B(s.batch);if(!b||s.active=='No'||s.joined.slice(0,7)>month)return 0;let paid=0;db.fees.filter(f=>f.sid==sid&&f.month==month).forEach(f=>paid+=+f.amt+ +f.disc);return Math.max(0,b.fee-paid)}
const wa=(ph,t)=>'https://wa.me/91'+String(ph||'').replace(/\D/g,'').slice(-10)+'?text='+encodeURIComponent(t);
function examRank(e,sid){const a=Object.entries(e.marks).filter(x=>x[1]!=='').sort((x,y)=>y[1]-x[1]);return a.findIndex(x=>x[0]==sid)+1}
const closeSheet=()=>{$('#sheet').className='';$('#sheet').innerHTML=''};
function openSheet(h){$('#sheet').innerHTML='<div class="box">'+h+'</div>';$('#sheet').className='on'}
function form(title,fields,v,onSave,onDel){
 const f=fields.map(x=>{const val=v[x.k]??'';let i;
  if(x.t=='select')i=`<select name="${x.k}">${x.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}" ${a==val?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
  else if(x.t=='area')i=`<textarea name="${x.k}" rows="3">${esc(val)}</textarea>`;
  else i=`<input name="${x.k}" type="${x.t||'text'}" value="${esc(val)}">`;
  return`<label>${x.l}${i}</label>`}).join('');
 openSheet(`<h2>${title}</h2><div id="fm">${f}</div><div class="row"><button id="sv">Save</button><button class="g" onclick="closeSheet()">Cancel</button>${onDel?'<button class="g bad" id="dl">Delete</button>':''}</div>`);
 $('#sv').onclick=()=>{const o={};document.querySelectorAll('#fm [name]').forEach(e=>o[e.name]=e.value);onSave(o);save();closeSheet();render()};
 if(onDel)$('#dl').onclick=()=>{if(confirm('Delete this? This cannot be undone.')){onDel();save();closeSheet();render()}}}
const bOpts=()=>db.batches.map(b=>[b.id,b.name]);
const sOpts=()=>active().map(s=>[s.id,s.name]);
const selB=(k,fn)=>`<select onchange="st.${k}=this.value;${fn||'render()'}">${db.batches.map(b=>`<option value="${b.id}" ${b.id==st[k]?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`;
// ---------- Students
function stuForm(id){const s=id?S(id):{id:uid(),batch:db.batches[0]?.id,joined:today(),active:'Yes'};
 if(!db.batches.length)return alert('Add a class first.');
 form(id?'Edit student':'Add student',[{k:'name',l:'Student name'},{k:'batch',l:'Class',t:'select',o:bOpts()},{k:'roll',l:'Roll no.',t:'number'},{k:'parent',l:'Parent name'},{k:'phone',l:'Parent phone / WhatsApp',t:'tel'},{k:'address',l:'Address'},{k:'joined',l:'Joining date',t:'date'},{k:'active',l:'Active?',t:'select',o:['Yes','No']},{k:'notes',l:'Notes',t:'area'}],s,o=>{if(!o.name)return;Object.assign(s,o);if(!id)db.students.push(s)},id&&(()=>{db.students=db.students.filter(x=>x.id!=id)}))}
// ---------- Classes
function batForm(id){const b=id?B(id):{id:uid(),fee:1000,time:'16:00'};
 form(id?'Edit class':'Add class',[{k:'name',l:'Class / batch name'},{k:'subject',l:'Subject'},{k:'days',l:'Days (e.g. Mon,Wed,Fri)'},{k:'time',l:'Time',t:'time'},{k:'fee',l:'Monthly fee (₹)',t:'number'}],b,o=>{if(!o.name)return;o.fee=+o.fee;Object.assign(b,o);if(!id)db.batches.push(b)},id&&(()=>{db.batches=db.batches.filter(x=>x.id!=id)}))}
// ---------- Attendance
function mark(b,sid,v){const k=attKey(st.date,b);db.att[k]=db.att[k]||{};db.att[k][sid]=db.att[k][sid]==v?'':v;if(!db.att[k][sid])delete db.att[k][sid];save();render()}
function allP(b){const k=attKey(st.date,b);db.att[k]=db.att[k]||{};inB(b).forEach(s=>db.att[k][s.id]='P');save();render()}
// ---------- Fees
function payForm(sid){const s=S(sid),n=Math.max(0,...db.fees.map(f=>f.rcpt||0),1000)+1;
 form('Record fee: '+s.name,[{k:'month',l:'Fee month',t:'month'},{k:'amt',l:'Amount paid (₹)',t:'number'},{k:'disc',l:'Discount (₹)',t:'number'},{k:'mode',l:'Mode',t:'select',o:['Cash','UPI','Bank']},{k:'date',l:'Date',t:'date'}],{month:st.month,amt:due(sid,st.month),disc:0,mode:'Cash',date:today()},o=>{if(!+o.amt&&!+o.disc)return;const fe={id:uid(),sid,month:o.month,amt:+o.amt,disc:+o.disc,mode:o.mode,date:o.date,rcpt:n};db.fees.push(fe);setTimeout(()=>receipt(fe.id),50)})}
function receipt(id){const f=db.fees.find(x=>x.id==id);if(!f)return;const s=S(f.sid),b=B(s.batch);
 openSheet(`<div style="text-align:center"><h2>${esc(db.set.name)}</h2><b>Fee receipt #${f.rcpt}</b></div><table><tr><td>Student</td><td>${esc(s.name)}</td></tr><tr><td>Class</td><td>${esc(b?.name)}</td></tr><tr><td>Fee month</td><td>${f.month}</td></tr><tr><td>Paid</td><td><b>${inr(f.amt)}</b> via ${f.mode}</td></tr><tr><td>Discount</td><td>${inr(f.disc)}</td></tr><tr><td>Date</td><td>${fmt(f.date)}</td></tr></table><div class="row noprint" style="margin-top:12px"><button onclick="window.print()">Print</button><a class="b g" target="_blank" href="${wa(s.phone,`Fee receipt #${f.rcpt}: ${inr(f.amt)} received for ${s.name} (${f.month}). Thank you! – ${db.set.name}`)}">Send on WhatsApp</a><button class="g" onclick="closeSheet()">Close</button></div>`)}
// ---------- Marks
function examForm(id){const e=id?db.exams.find(x=>x.id==id):{id:uid(),batch:st.bat,date:today(),max:100,marks:{}};
 form(id?'Edit test':'New test',[{k:'name',l:'Test name'},{k:'batch',l:'Class',t:'select',o:bOpts()},{k:'date',l:'Date',t:'date'},{k:'max',l:'Maximum marks',t:'number'}],e,o=>{if(!o.name)return;o.max=+o.max;Object.assign(e,o);if(!id)db.exams.push(e)},id&&(()=>{db.exams=db.exams.filter(x=>x.id!=id)}))}
function marksSheet(id){const e=db.exams.find(x=>x.id==id);
 openSheet(`<h2>${esc(e.name)} (out of ${e.max})</h2>${inB(e.batch).map(s=>`<label>${esc(s.name)}<input type="number" data-s="${s.id}" max="${e.max}" value="${e.marks[s.id]??''}"></label>`).join('')}<div class="row"><button id="ms">Save marks</button><button class="g" onclick="closeSheet()">Cancel</button></div>`);
 $('#ms').onclick=()=>{document.querySelectorAll('[data-s]').forEach(i=>{if(i.value==='')delete e.marks[i.dataset.s];else e.marks[i.dataset.s]=Math.min(+i.value,e.max)});save();closeSheet();render()}}
// ---------- PTM & events
function ptmForm(id){const p=id?db.ptm.find(x=>x.id==id):{id:uid(),sid:active()[0]?.id,date:today(),who:'Mother'};
 form(id?'Edit PTM':'New PTM record',[{k:'sid',l:'Student',t:'select',o:sOpts()},{k:'date',l:'Date',t:'date'},{k:'who',l:'Who attended',t:'select',o:['Mother','Father','Both','Guardian','Did not attend']},{k:'notes',l:'Discussion points',t:'area'},{k:'action',l:'Action items',t:'area'},{k:'follow',l:'Follow-up date',t:'date'}],p,o=>{Object.assign(p,o);if(!id)db.ptm.push(p)},id&&(()=>{db.ptm=db.ptm.filter(x=>x.id!=id)}))}
function evForm(){form('Add event or holiday',[{k:'title',l:'Title'},{k:'date',l:'Date',t:'date'}],{date:st.cd},o=>{if(o.title)db.events.push({id:uid(),...o})})}
function dayItems(d){const r=[];db.batches.forEach(b=>{if(b.days.toLowerCase().includes(dow(d).toLowerCase()))r.push('Class: '+b.name+' at '+b.time)});
 db.exams.filter(e=>e.date==d).forEach(e=>r.push('Test: '+e.name));db.ptm.filter(p=>p.date==d).forEach(p=>r.push('PTM: '+S(p.sid)?.name));db.ptm.filter(p=>p.follow==d).forEach(p=>r.push('Follow-up: '+S(p.sid)?.name));
 if(+d.slice(8)==+db.set.dueDay)r.push('Fees due today');db.events.filter(e=>e.date==d).forEach(e=>r.push('Event: '+e.title));return r}
// ---------- Views
const V={
dash(){const t=today(),cl=db.batches.filter(b=>b.days.toLowerCase().includes(dow(t).toLowerCase())),m=t.slice(0,7);
 const ab=[];for(const k in db.att){if(k.startsWith(t))for(const s in db.att[k])if(db.att[k][s]=='A'&&S(s))ab.push(S(s))}
 const dues=active().filter(s=>due(s.id,m)>0),tot=dues.reduce((a,s)=>a+due(s.id,m),0),fu=db.ptm.filter(p=>p.follow>=t&&p.follow<=ymd(new Date(Date.now()+7*864e5)));
 return`<div class="grid"><div class="stat"><b>${active().length}</b><small>Active students</small></div><div class="stat"><b>${cl.length}</b><small>Classes today</small></div><div class="stat"><b>${ab.length}</b><small>Absent today</small></div><div class="stat"><b>${inr(tot)}</b><small>Fees pending this month</small></div></div>
 ${widgets()}<h3>Today’s classes</h3>${cl.map(b=>`<div class="card row sp"><span><b>${esc(b.name)}</b><br><span class="mut">${b.time} · ${inB(b.id).length} students</span></span><button class="sm" onclick="st.bat='${b.id}';st.date=today();go('att')">Take attendance</button></div>`).join('')||'<p class="mut">No classes today. Enjoy the break.</p>'}
